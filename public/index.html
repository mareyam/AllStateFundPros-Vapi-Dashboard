<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AllStateFundPros Vapi Dashboard</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f5f5;
    --surface-2: #ececec;
    --border: #d8d8d8;
    --text: #0a0a0a;
    --text-dim: #666666;
    --accent: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-2: #202020;
      --border: #2e2e2e;
      --text: #f5f5f5;
      --text-dim: #9a9a9a;
      --accent: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #202020;
    --border: #2e2e2e;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 20px 24px;
    border-bottom: 2px solid var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .controls label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
  select, button, input[type=text], input[type=date] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
  }
  button {
    cursor: pointer;
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
    font-weight: 600;
  }
  button:hover { opacity: .85; }
  button.secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .stats { display: flex; gap: 10px; padding: 16px 24px; flex-wrap: wrap; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 110px;
  }
  .stat .n { font-size: 20px; font-weight: 700; }
  .stat .l { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-dim); padding: 8px 24px; border-bottom: 2px solid var(--text);
  }
  tbody td { padding: 12px 24px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface); }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 600;
    border: 1px solid var(--text);
  }
  .badge-ai-completed { background: var(--text); color: var(--bg); }
  .badge-forwarded { background: transparent; color: var(--text); }
  .badge-voicemail { background: var(--surface-2); color: var(--text-dim); border-style: dashed; }
  .badge-cut { background: transparent; color: var(--text-dim); border-style: dotted; }
  .badge-no-answer { background: transparent; color: var(--text-dim); border-style: dotted; }
  .badge-other { background: transparent; color: var(--text-dim); }
  .handled-ai { font-weight: 700; }
  .handled-human { font-weight: 700; text-decoration: underline; }
  .handled-voicemail { color: var(--text-dim); }
  .handled-unclear, .handled-none { color: var(--text-dim); font-style: italic; }
  .quote { color: var(--text-dim); font-size: 12.5px; line-height: 1.5; }
  .quote div { margin-bottom: 3px; }
  .quote div::before { content: "\201C"; }
  .quote div::after { content: "\201D"; }
  .empty { padding: 60px 24px; text-align: center; color: var(--text-dim); }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 24px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg); border: 2px solid var(--text); border-radius: 10px;
    max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 24px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }
  .modal pre {
    white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.6;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; max-height: 320px; overflow-y: auto;
  }
  .modal .close { float: right; background: none; border: none; color: var(--text-dim); font-size: 20px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 16px 0 6px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>AllStateFundPros Vapi Dashboard</h1>
    <div class="sub" id="sub">Loading…</div>
  </div>
  <button id="refresh">Refresh</button>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <label>From</label>
  <input id="dateStart" type="date" />
  <label>To</label>
  <input id="dateEnd" type="date" />
  <button class="secondary" id="applyDates">Apply range</button>
  <select id="outcomeFilter">
    <option value="">Picked up + forwarded</option>
    <option value="ai-completed">Picked up (AI)</option>
    <option value="forwarded">Forwarded to human</option>
  </select>
  <select id="handledFilter">
    <option value="">AI or human: all</option>
    <option value="ai">AI picked up</option>
    <option value="human">Human picked up</option>
    <option value="unclear">Unclear</option>
  </select>
  <input id="search" type="text" placeholder="Search phone number…" />
  <label style="display:flex;align-items:center;gap:6px;margin-left:auto;">
    <input id="showAll" type="checkbox" style="width:auto;" />
    Show no-answers / voicemail / failed too
  </label>
</div>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Customer</th>
      <th>Duration</th>
      <th>Outcome</th>
      <th>Picked up by</th>
      <th>Customer said</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="empty" style="display:none">No calls match these filters.</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="closeModal">×</button>
    <h2 id="modalTitle"></h2>
    <div class="meta" id="modalMeta"></div>
    <div class="section-label">Customer said (verbatim)</div>
    <div id="modalQuotes" class="quote"></div>
    <div class="section-label">Full transcript</div>
    <pre id="modalTranscript"></pre>
  </div>
</div>

<script>
const OUTCOME_LABEL = {
  'ai-completed': 'Picked up (AI)',
  forwarded: 'Forwarded to human',
  voicemail: 'Voicemail',
  cut: 'Call cut',
  'no-answer': 'No answer',
  other: 'Other'
};
const HANDLED_LABEL = {
  ai: 'AI',
  human: 'Human',
  voicemail: 'Voicemail',
  unclear: 'Unclear',
  none: '—'
};

let allCalls = [];

function isoDate(d) { return d.toISOString().slice(0, 10); }

function defaultRange() {
  return { start: '2026-06-01', end: isoDate(new Date()) };
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtDuration(sec) {
  if (sec === null || sec === undefined) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + 'm ' + s + 's';
}

function render() {
  const outcomeFilter = document.getElementById('outcomeFilter').value;
  const handledFilter = document.getElementById('handledFilter').value;
  const search = document.getElementById('search').value.trim();

  const filtered = allCalls.filter(c => {
    if (outcomeFilter && c.outcome !== outcomeFilter) return false;
    if (handledFilter && c.handledBy !== handledFilter) return false;
    if (search && !c.customerNumber.includes(search)) return false;
    return true;
  });

  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';

  for (const c of filtered) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${fmtDate(c.startedAt)}</td>
      <td>${c.customerNumber || '—'}</td>
      <td>${fmtDuration(c.durationSec)}</td>
      <td><span class="badge badge-${c.outcome}">${OUTCOME_LABEL[c.outcome] || c.outcome}</span></td>
      <td class="handled-${c.handledBy}">${HANDLED_LABEL[c.handledBy] || c.handledBy}</td>
      <td class="quote">${c.quotes.map(q => '<div>' + escapeHtml(q) + '</div>').join('') || '—'}</td>
    `;
    tr.addEventListener('click', () => openModal(c));
    rows.appendChild(tr);
  }

  renderStats();
}

function renderStats() {
  const total = allCalls.length;
  const picked = allCalls.filter(c => c.outcome === 'ai-completed').length;
  const forwarded = allCalls.filter(c => c.outcome === 'forwarded').length;
  const counts = {};
  for (const c of allCalls) counts[c.handledBy] = (counts[c.handledBy] || 0) + 1;
  const stats = document.getElementById('stats');
  stats.innerHTML = '';
  const addStat = (label, n) => {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = '<div class="n">' + n + '</div><div class="l">' + label + '</div>';
    stats.appendChild(div);
  };
  addStat('Shown', total);
  addStat('Picked up', picked);
  addStat('Forwarded', forwarded);
  addStat('AI handled', counts.ai || 0);
  addStat('Human handled', counts.human || 0);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(c) {
  document.getElementById('modalTitle').textContent = c.customerNumber || 'Unknown number';
  document.getElementById('modalMeta').textContent =
    fmtDate(c.startedAt) + ' · ' + fmtDuration(c.durationSec) + ' · ' + (OUTCOME_LABEL[c.outcome] || c.outcome) + ' · picked up by: ' + (HANDLED_LABEL[c.handledBy] || c.handledBy) + ' · ended: ' + (c.endedReason || '—');
  document.getElementById('modalQuotes').innerHTML =
    c.quotes.map(q => '<div>' + escapeHtml(q) + '</div>').join('') || '<div style="font-style:italic">No customer speech captured.</div>';
  document.getElementById('modalTranscript').textContent = c.transcript || '(no transcript available)';
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') e.target.classList.remove('open');
});

['outcomeFilter', 'handledFilter', 'search'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);

document.getElementById('applyDates').addEventListener('click', load);
document.getElementById('showAll').addEventListener('change', load);

async function load() {
  const start = document.getElementById('dateStart').value;
  const end = document.getElementById('dateEnd').value;
  const showAll = document.getElementById('showAll').checked;
  document.getElementById('sub').textContent = 'Loading calls from Google Sheet…';
  try {
    const params = new URLSearchParams();
    if (start) params.set('start', start);
    if (end) params.set('end', end);
    if (showAll) params.set('all', '1');
    const res = await fetch('/api/calls?' + params.toString());
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    allCalls = await res.json();
    document.getElementById('sub').textContent = allCalls.length + ' calls, ' + (start || '2026-06-01') + ' to ' + (end || 'today') + (showAll ? ' (showing all)' : ' (picked up + forwarded only)');
    render();
  } catch (err) {
    document.getElementById('sub').textContent = 'Failed to load: ' + err.message;
  }
}

document.getElementById('refresh').addEventListener('click', load);

const range = defaultRange();
document.getElementById('dateStart').value = range.start;
document.getElementById('dateEnd').value = range.end;
load();
</script>
</body>
</html>
